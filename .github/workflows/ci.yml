name: CI

on:
  pull_request:
    branches: [main, dev]

# Push liên tiếp vào cùng một PR sẽ huỷ run cũ, đỡ tốn phút Actions.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm ci cài đúng version trong package-lock.json, không tự nâng cấp như npm install.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint
